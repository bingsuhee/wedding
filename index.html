<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf8f3" />
  <title>축하해주셔서 감사합니다 | 수빈 & 소희</title>
  <meta name="description" content="수빈과 소희의 새로운 시작을 축하해주셔서 진심으로 감사합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="축하해주셔서 감사합니다 | 수빈 & 소희" />
  <meta property="og:description" content="따뜻한 마음으로 함께해주셔서 진심으로 감사합니다." />
  <meta property="og:url" content="https://bingsuhee.github.io/wedding/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="축하해주셔서 감사합니다 | 수빈 & 소희" />
  <meta name="twitter:description" content="따뜻한 마음으로 함께해주셔서 진심으로 감사합니다." />
  <style>
    :root {
      color-scheme: light;
      --ink: #51463f;
      --muted: #8d8177;
      --rose: #bd8f83;
      --paper: #fbf8f3;
      --line: #e9ded5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(232, 208, 194, .34), transparent 34%),
        radial-gradient(ellipse at 90% 86%, rgba(224, 214, 193, .32), transparent 35%),
        var(--paper);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: min(100%, 560px);
      padding: clamp(42px, 9vw, 76px) clamp(24px, 8vw, 64px);
      overflow: hidden;
      text-align: center;
      background: rgba(255, 253, 250, .88);
      border: 1px solid rgba(233, 222, 213, .9);
      border-radius: 4px;
      box-shadow: 0 24px 70px rgba(90, 68, 51, .08);
      animation: arrive .9s ease-out both;
    }

    .card::before, .card::after {
      position: absolute;
      width: 120px;
      height: 120px;
      content: "";
      border: 1px solid rgba(189, 143, 131, .28);
      border-radius: 50%;
      pointer-events: none;
    }
    .card::before { top: -76px; left: -72px; }
    .card::after { right: -76px; bottom: -78px; }

    .flower {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--rose);
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--rose);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Batang", "바탕", "Noto Serif KR", serif;
      font-size: clamp(27px, 6vw, 38px);
      font-weight: 400;
      letter-spacing: -.06em;
      line-height: 1.55;
      word-break: keep-all;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 112px;
      margin: 28px auto;
      color: var(--rose);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      height: 1px;
      flex: 1;
      content: "";
      background: var(--line);
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-family: "Batang", "바탕", "Noto Serif KR", serif;
      font-size: 15px;
      line-height: 2.15;
      word-break: keep-all;
    }

    .names {
      margin: 34px 0 0;
      color: #75645a;
      font-family: "Batang", "바탕", "Noto Serif KR", serif;
      font-size: 17px;
      letter-spacing: .08em;
    }
    .names span { padding: 0 8px; color: var(--rose); font-size: 13px; }

    .date {
      margin: 12px 0 0;
      color: #aa9d92;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: .16em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="flower" aria-hidden="true">❋</div>
    <p class="eyebrow">With gratitude</p>
    <h1>축하해주셔서<br />진심으로 감사합니다</h1>
    <div class="divider" aria-hidden="true">♡</div>
    <p class="message">
      저희의 새로운 시작을 따뜻한 마음으로 축복해주셔서 감사합니다.<br />
      보내주신 소중한 마음 오래도록 간직하며<br />
      서로 아끼고 사랑하며 예쁘게 살아가겠습니다.
    </p>
    <p class="names">수빈 <span>♥</span> 소희</p>
    <p class="date">OCTOBER 11, 2026</p>
  </main>
</body>
</html>
